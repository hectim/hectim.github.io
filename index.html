<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Family Gift Exchange</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #eef2fb;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
    }
    .card {
        background: white;
        padding: 32px;
        border-radius: 12px;
        width: 480px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    h1 {
        text-align: center;
        font-size: 26px;
        margin: 0 0 24px;
    }
    label {
        font-weight: bold;
        margin-top: 20px;
        display: block;
        margin-bottom: 8px;
    }
    input[type="number"], input[type="text"], select {
        width: 100%;
        padding: 10px;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
    }
    select.placeholder { color: #888; }
    .row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
    }
    .name-item, .ex-item {
        background: #f4f7ff;
        border-radius: 6px;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
    }
    .name-item span, .ex-item span {
        flex-grow: 1;
    }
    .remove {
        background: #F53838;
        color: white;
        border: none;
        font-weight: bold;
        width: 30px;
        height: 28px;
        border-radius: 6px;
        cursor: pointer;
    }
    button.add {
        width: 45px;
        background: #72BB72;;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
        font-weight: bold;
    }
    .generate {
        margin-top: 24px;
        width: 100%;
        padding: 12px;
        font-size: 16px;
        background: #72BB72;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        border: none;
        font-weight: bold;
    }
    pre {
        background: #f7f9ff;
        border: 1px solid #dce3f4;
        padding: 14px;
        border-radius: 6px;
        white-space: pre-wrap;
        margin-top: 20px;
    }
</style>
</head>
<body>
<div class="card">
    <h1>Family Gift Exchange</h1>

    <label>Year</label>
    <input id="year" type="number" value="2026">

    <label>Names</label>
    <div class="row">
        <input id="nameInput" type="text" placeholder="Add name">
        <button class="add" onclick="addName()">+</button>
    </div>
    <div id="nameList"></div>

    <label>Do-Not-Pair List (mutual)</label>
    <div class="row">
        <select id="giverSelect" class="placeholder">
            <option disabled selected>Pick name</option>
        </select>
        <select id="receiverSelect" class="placeholder">
            <option disabled selected>Pick name</option>
        </select>
        <button class="add" onclick="addException()">+</button>
    </div>
    <div id="exceptionList"></div>

    <button class="generate" onclick="generate()">Generate</button>

    <pre id="output"></pre>
</div>

<script>
let names = [
    "Amanda","Joe","Kelsey","Brett","Shayne",
    "Ivanna","Brady","Torey","Connor","Julia","Logan"
];

let exceptions = [
    ["Amanda","Joe"],
    ["Kelsey","Brett"],
    ["Shayne","Ivanna"],
    ["Brady","Torey"],
    ["Connor","Julia"]
];

function render() {
    const nameBox = document.getElementById("nameList");
    const exBox   = document.getElementById("exceptionList");
    const giverSel = document.getElementById("giverSelect");
    const recvSel  = document.getElementById("receiverSelect");
    nameBox.innerHTML = "";
    exBox.innerHTML = "";

    giverSel.innerHTML = `<option disabled selected>Pick name</option>`;
    recvSel.innerHTML  = `<option disabled selected>Pick name</option>`;

    names.forEach(name => {
        giverSel.innerHTML += `<option>${name}</option>`;
        recvSel.innerHTML += `<option>${name}</option>`;
        nameBox.innerHTML += `
            <div class="name-item">
                <span>${name}</span>
                <button class="remove" onclick="removeName('${name}')">×</button>
            </div>`;
    });

    exceptions.forEach(([a,b], i) => {
        exBox.innerHTML += `
            <div class="ex-item">
                <span>${a} ↔ ${b}</span>
                <button class="remove" onclick="removeException(${i})">×</button>
            </div>`;
    });
}
function addName() {
    const val = document.getElementById("nameInput").value.trim();
    if (val && !names.includes(val)) names.push(val);
    document.getElementById("nameInput").value = "";
    render();
}
function removeName(n) {
    names = names.filter(x => x !== n);
    exceptions = exceptions.filter(e => e[0] !== n && e[1] !== n);
    render();
}
function addException() {
    const g = document.getElementById("giverSelect").value;
    const r = document.getElementById("receiverSelect").value;
    if (!g || !r || g === r) return;
    if (!exceptions.some(e => (e[0]===g && e[1]===r) || (e[0]===r && e[1]===g))) {
        exceptions.push([g,r]);
    }
    render();
}
function removeException(i){ exceptions.splice(i,1); render(); }

function generate() {
    const year = parseInt(document.getElementById("year").value,10);
    const n = names.length;
    if (n < 2) return;

    let picks = [...names];
    const offset = year % n;
    picks = picks.slice(offset).concat(picks.slice(0, offset));

    const banned = new Set();
    exceptions.forEach(([a,b])=>{
        banned.add(`${a}:${b}`);
        banned.add(`${b}:${a}`);
    });

    for (let i=0;i<n;i++){
        const g = names[i], r = picks[i];
        if (g===r || banned.has(`${g}:${r}`)){
            for (let j=i+1;j<n;j++){
                if (picks[j]!==g && !banned.has(`${g}:${picks[j]}`)){
                    [picks[i],picks[j]]=[picks[j],picks[i]];
                    break;
                }
            }
        }
    }

    for (let i=0;i<n;i++){
        if (names[i]===picks[i] || banned.has(`${names[i]}:${picks[i]}`)) {
            document.getElementById("output").textContent =
            "No valid assignment for that year.";
            return;
        }
    }

    document.getElementById("output").textContent =
        names.map((g,i)=>`${g} ➜ ${picks[i]}`).join("\n");
}
render();
</script>
</body>
</html>
