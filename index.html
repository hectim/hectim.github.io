<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Family Gift Exchange</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #eef2fb;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
    }
    .card {
        background: white;
        padding: 32px;
        border-radius: 12px;
        max-width: 1000px;
        width: 100%;
        box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    .main-content {
        display: flex;
        gap: 32px;
        margin-top: 24px;
    }
    .left-column {
        flex: 1;
        min-width: 0;
        font-size: 13px;
    }
    .right-column {
        flex: 2;
        min-width: 0;
    }
    h1 {
        text-align: center;
        font-size: 26px;
        margin: 0 0 24px;
    }
    label {
        font-weight: bold;
        margin-top: 20px;
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
    }
    .left-column label {
        font-size: 12px;
        margin-top: 16px;
    }
    input[type="number"], input[type="text"], select {
        width: 100%;
        padding: 8px;
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
    }
    select.placeholder { color: #888; }
    .row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
    }
    .name-item, .ex-item {
        background: #f4f7ff;
        border-radius: 6px;
        padding: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        font-size: 13px;
    }
    .name-item span, .ex-item span {
        flex-grow: 1;
    }
    .remove {
        background: #F53838;
        color: white;
        border: none;
        font-weight: bold;
        width: 26px;
        height: 24px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }
    button.add {
        width: 40px;
        background: #72BB72;;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
    }
    pre {
        background: #f7f9ff;
        border: 1px solid #dce3f4;
        padding: 20px;
        border-radius: 6px;
        white-space: pre-wrap;
        margin: 0;
        min-height: 300px;
        font-size: 18px;
        line-height: 1.8;
        font-family: Arial, sans-serif;
    }
    .results-label {
        font-weight: bold;
        margin-bottom: 12px;
        display: block;
        font-size: 18px;
    }
    @media (max-width: 768px) {
        .main-content {
            flex-direction: column;
        }
    }
</style>
</head>
<body>
<div class="card">
    <h1>Family Gift Exchange</h1>

    <label>Year</label>
    <input id="year" type="number" onchange="generate()" oninput="generate()">

    <div class="main-content">
        <div class="left-column">
            <label>Names</label>
            <div class="row">
                <input id="nameInput" type="text" placeholder="Add name">
                <button class="add" onclick="addName()">+</button>
            </div>
            <div id="nameList"></div>

            <label>Do-Not-Pair List (mutual)</label>
            <div class="row">
                <select id="giverSelect" class="placeholder">
                    <option disabled selected>Pick name</option>
                </select>
                <select id="receiverSelect" class="placeholder">
                    <option disabled selected>Pick name</option>
                </select>
                <button class="add" onclick="addException()">+</button>
            </div>
            <div id="exceptionList"></div>
        </div>

        <div class="right-column">
            <label class="results-label">Results</label>
            <pre id="output"></pre>
        </div>
    </div>
</div>

<script>
let names = [
    "Amanda","Joe","Kelsey","Brett","Shayne",
    "Ivanna","Brady","Torey","Connor","Julia","Logan"
].sort();

let exceptions = [
    ["Amanda","Joe"],
    ["Kelsey","Brett"],
    ["Shayne","Ivanna"],
    ["Brady","Torey"],
    ["Connor","Julia"]
];

function render() {
    const nameBox = document.getElementById("nameList");
    const exBox   = document.getElementById("exceptionList");
    const giverSel = document.getElementById("giverSelect");
    const recvSel  = document.getElementById("receiverSelect");
    nameBox.innerHTML = "";
    exBox.innerHTML = "";

    giverSel.innerHTML = `<option disabled selected>Pick name</option>`;
    recvSel.innerHTML  = `<option disabled selected>Pick name</option>`;

    names.forEach(name => {
        giverSel.innerHTML += `<option>${name}</option>`;
        recvSel.innerHTML += `<option>${name}</option>`;
        nameBox.innerHTML += `
            <div class="name-item">
                <span>${name}</span>
                <button class="remove" onclick="removeName('${name}')">×</button>
            </div>`;
    });

    exceptions.forEach(([a,b], i) => {
        exBox.innerHTML += `
            <div class="ex-item">
                <span>${a} ↔ ${b}</span>
                <button class="remove" onclick="removeException(${i})">×</button>
            </div>`;
    });
}
function addName() {
    const val = document.getElementById("nameInput").value.trim();
    if (val && !names.includes(val)) {
        names.push(val);
        names.sort();
    }
    document.getElementById("nameInput").value = "";
    render();
    generate();
}
function removeName(n) {
    names = names.filter(x => x !== n);
    exceptions = exceptions.filter(e => e[0] !== n && e[1] !== n);
    render();
    generate();
}
function addException() {
    const g = document.getElementById("giverSelect").value;
    const r = document.getElementById("receiverSelect").value;
    if (!g || !r || g === r) return;
    if (!exceptions.some(e => (e[0]===g && e[1]===r) || (e[0]===r && e[1]===g))) {
        exceptions.push([g,r]);
    }
    render();
    generate();
}
function removeException(i){ 
    exceptions.splice(i,1); 
    render(); 
    generate();
}

function generate() {
    const year = parseInt(document.getElementById("year").value,10);
    const n = names.length;
    if (n < 2) {
        document.getElementById("output").textContent = "Need at least 2 people.";
        return;
    }

    // Sort names and exceptions to ensure deterministic results regardless of input order
    const sortedNames = [...names].sort();
    const sortedExceptions = exceptions.map(([a,b]) => a < b ? [a,b] : [b,a]).sort(([a1,b1], [a2,b2]) => {
        if (a1 !== a2) return a1.localeCompare(a2);
        return b1.localeCompare(b2);
    });

    const banned = new Set();
    sortedExceptions.forEach(([a,b])=>{
        banned.add(`${a}:${b}`);
        banned.add(`${b}:${a}`);
    });

    // For each person, generate all possible receivers (excluding self and exceptions)
    const possibleReceivers = new Map();
    sortedNames.forEach(giver => {
        const receivers = sortedNames.filter(receiver => 
            giver !== receiver && !banned.has(`${giver}:${receiver}`)
        );
        possibleReceivers.set(giver, receivers);
    });

    // Create seed from names and exceptions (not year - year will determine cycle position)
    let baseSeed = 0;
    sortedNames.forEach(name => {
        for (let i = 0; i < name.length; i++) {
            baseSeed = ((baseSeed << 5) - baseSeed) + name.charCodeAt(i);
            baseSeed = baseSeed & baseSeed;
        }
    });
    sortedExceptions.forEach(([a,b]) => {
        const pair = `${a}:${b}`;
        for (let i = 0; i < pair.length; i++) {
            baseSeed = ((baseSeed << 5) - baseSeed) + pair.charCodeAt(i);
            baseSeed = baseSeed & baseSeed;
        }
    });

    function seededRandom(seedValue) {
        let s = seedValue;
        return () => {
            s = Math.sin(s) * 10000;
            return s - Math.floor(s);
        };
    }

    // For each person, determine their cycle length (number of possible receivers)
    // Each person cycles through ALL their receivers exactly once per cycle
    const cycleLengths = new Map();
    sortedNames.forEach(giver => {
        cycleLengths.set(giver, possibleReceivers.get(giver).length);
    });
    
    // Find the LCM (least common multiple) of all cycle lengths for overall cycle
    // This ensures each person completes their cycle before the overall cycle repeats
    function gcd(a, b) {
        return b === 0 ? a : gcd(b, a % b);
    }
    function lcm(a, b) {
        return (a * b) / gcd(a, b);
    }
    const overallCycleLength = Array.from(cycleLengths.values()).reduce(lcm, 1);
    
    // Determine which cycle we're in and position within cycle
    const cycleNumber = Math.floor(year / overallCycleLength);
    const positionInCycle = year % overallCycleLength;

    // For each cycle, generate a random order of receivers for each person
    // This order changes per cycle but is deterministic based on cycle number
    // Each person gets ALL their receivers in a random order, exactly once per cycle
    const cycleReceivers = new Map();
    sortedNames.forEach(giver => {
        const receivers = [...possibleReceivers.get(giver)];
        const cycleSeed = baseSeed + cycleNumber * 1000 + giver.charCodeAt(0);
        const rand = seededRandom(cycleSeed);
        // Shuffle receivers for this cycle - each person cycles through all their receivers
        const shuffled = [...receivers].sort(() => rand() - 0.5);
        cycleReceivers.set(giver, shuffled);
    });

    // Get previous year's assignment to avoid consecutive repeats
    let prevPairings = new Set();
    if (year > 0) {
        const prevCycleNumber = Math.floor((year - 1) / overallCycleLength);
        const prevPositionInCycle = (year - 1) % overallCycleLength;
        const prevCycleReceivers = new Map();
        
        sortedNames.forEach(giver => {
            const receivers = [...possibleReceivers.get(giver)];
            const prevCycleSeed = baseSeed + prevCycleNumber * 1000 + giver.charCodeAt(0);
            const prevRand = seededRandom(prevCycleSeed);
            const prevShuffled = [...receivers].sort(() => prevRand() - 0.5);
            prevCycleReceivers.set(giver, prevShuffled);
        });
        
        // Generate previous year's assignment
        const prevAssignment = new Map();
        const prevUsed = new Set();
        
        sortedNames.forEach(giver => {
            const receivers = prevCycleReceivers.get(giver);
            const receiverIndex = prevPositionInCycle % receivers.length;
            const receiver = receivers[receiverIndex];
            prevAssignment.set(giver, receiver);
            prevPairings.add(`${giver}:${receiver}`);
        });
    }

    // For this year, each person tries to get the receiver at their cycle position
    // But we need to ensure it's a valid derangement (no conflicts, no repeats from last year)
    const assignment = new Map();
    const usedReceivers = new Set();
    
    // Sort givers to prioritize those with fewer options
    const sortedGivers = [...sortedNames].sort((a, b) => 
        cycleReceivers.get(a).length - cycleReceivers.get(b).length
    );
    
    function findValidAssignment(giverIndex) {
        if (giverIndex >= sortedGivers.length) {
            return true; // All assigned successfully
        }
        
        const giver = sortedGivers[giverIndex];
        const receivers = cycleReceivers.get(giver);
        // Each person cycles through their receivers - use modulo to wrap around
        const receiverIndex = positionInCycle % receivers.length;
        
        // Try the receiver at this cycle position first
        const preferredReceiver = receivers[receiverIndex];
        const preferredKey = `${giver}:${preferredReceiver}`;
        
        // Check if preferred receiver is available and doesn't repeat last year
        if (!usedReceivers.has(preferredReceiver) && !prevPairings.has(preferredKey)) {
            assignment.set(giver, preferredReceiver);
            usedReceivers.add(preferredReceiver);
            if (findValidAssignment(giverIndex + 1)) {
                return true;
            }
            assignment.delete(giver);
            usedReceivers.delete(preferredReceiver);
        }
        
        // If preferred doesn't work, try other receivers in order
        for (let i = 0; i < receivers.length; i++) {
            if (i === receiverIndex) continue; // Already tried
            
            const receiver = receivers[i];
            const key = `${giver}:${receiver}`;
            
            if (!usedReceivers.has(receiver) && !prevPairings.has(key)) {
                assignment.set(giver, receiver);
                usedReceivers.add(receiver);
                if (findValidAssignment(giverIndex + 1)) {
                    return true;
                }
                assignment.delete(giver);
                usedReceivers.delete(receiver);
            }
        }
        
        return false; // No valid assignment found
    }
    
    if (!findValidAssignment(0)) {
        // Fallback: try without the previous year constraint
        assignment.clear();
        usedReceivers.clear();
        prevPairings.clear();
        
        if (!findValidAssignment(0)) {
            document.getElementById("output").textContent = "No valid assignment possible.";
            return;
        }
    }
    
    // Convert to array format for display
    const picks = sortedNames.map(giver => assignment.get(giver));
    
    document.getElementById("output").textContent =
        sortedNames.map((g,i)=>`${g} ➜ ${picks[i]}`).join("\n");
}

// Set year to current year on load
document.getElementById("year").value = new Date().getFullYear();

// Initial render and generate
render();
generate();
</script>
</body>
</html>
